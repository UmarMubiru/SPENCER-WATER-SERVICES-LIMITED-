{% extends "base.html" %}

{% block title %}Inventory Item{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-10">

        <div class="card border-0 shadow-sm">

            <div class="card-header bg-white">

                <h4 class="mb-0">

                    Inventory Item

                </h4>

            </div>

            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    <div class="row g-4">

                        {% for field in form %}

                        <div class="col-md-6">

                            <label class="form-label">

                                {{ field.label }}

                            </label>

                            {{ field }}

                            {% if field.errors %}

                                <small class="text-danger">

                                    {{ field.errors|striptags }}

                                </small>

                            {% endif %}

                        </div>

                        {% endfor %}

                    </div>

                    <hr>

                    <div class="text-end">

                        <a href="{% url 'inventory-list' %}" class="btn btn-light">

                            Cancel

                        </a>

                        <button class="btn btn-primary">

                            <i class="bi bi-check-circle"></i>

                            Save Item

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
